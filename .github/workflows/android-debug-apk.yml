name: Android Debug APK (Vivo Test)

# Manual cloud build for immediate Vivo Android phone testing.
# - Free on GitHub Actions ubuntu-latest (no paid services, no Android Studio on PC).
# - Requires ZERO signing credentials or private keys.
# - Keeps the compiled APK as a Private Workflow Artifact (never published).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Capacitor Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Required by Capacitor Android 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web ERP Bundle (dist/)
        run: npm run build:mobile

      - name: Generate & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Vivo Camera, Gallery & WhatsApp Manifest Permissions
        run: node android-setup/prepare-android-manifest.mjs

      - name: Compile Android Debug APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Stage Debug APK & SHA-256 Checksum
        run: |
          mkdir -p dist-apk
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            echo "Debug APK was not produced at $APK_SOURCE"
            exit 1
          fi
          cp "$APK_SOURCE" "dist-apk/Bapasitaram-ERP-debug.apk"
          sha256sum "dist-apk/Bapasitaram-ERP-debug.apk" > "dist-apk/Bapasitaram-ERP-debug.apk.sha256"
          ls -lh dist-apk/

      - name: Upload Private Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bapasitaram-erp-debug-apk-${{ github.run_number }}
          path: |
            dist-apk/Bapasitaram-ERP-debug.apk
            dist-apk/Bapasitaram-ERP-debug.apk.sha256
          retention-days: 14
          if-no-files-found: error
