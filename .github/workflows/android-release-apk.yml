name: Android Release APK (Manual)

# Separate manual Release APK workflow.
# - Does NOT require signing credentials yet (defaults to unsigned_dry_run).
# - Uses GitHub Encrypted Secrets ONLY when signing_mode is explicitly set to
#   'signed_with_secrets' after you approve release signing setup.
# - Never commits keystores, never publishes to Play Store, never enables billing.
on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: 'Build mode (use unsigned_dry_run until release signing secrets are approved)'
        required: true
        default: 'unsigned_dry_run'
        type: choice
        options:
          - unsigned_dry_run
          - signed_with_secrets

permissions:
  contents: read

concurrency:
  group: android-release-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release-apk:
    name: Build Capacitor Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4

      - name: Validate Release Signing Secrets (Only When Signed Mode Selected)
        if: ${{ inputs.signing_mode == 'signed_with_secrets' }}
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ "$HAS_KEYSTORE" != "true" ] || [ "$HAS_STORE_PASS" != "true" ] || [ "$HAS_KEY_ALIAS" != "true" ] || [ "$HAS_KEY_PASS" != "true" ]; then
            echo "Release signing secrets are not configured yet."
            echo "Configure ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD in GitHub Repository Secrets before choosing signed_with_secrets."
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21 (Required by Capacitor Android 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK (API 36)
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: Build Web ERP Bundle (dist/)
        run: npm run build:mobile

      - name: Generate & Sync Capacitor Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Apply Vivo Camera, Gallery & WhatsApp Manifest Permissions
        run: node android-setup/prepare-android-manifest.mjs

      - name: Inject Optional google-services.json From Encrypted Secret (If Configured Later)
        env:
          GOOGLE_SERVICES_B64: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_B64" ]; then
            echo "$GOOGLE_SERVICES_B64" | base64 --decode > android/app/google-services.json
            echo "Applied google-services.json from GitHub Encrypted Secret."
          else
            echo "ANDROID_GOOGLE_SERVICES_JSON_B64 not set; continuing with existing web Firebase config."
          fi

      - name: Compile Unsigned Release APK (Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage Unsigned Release APK (Dry Run — No Signing Secrets Required)
        if: ${{ inputs.signing_mode == 'unsigned_dry_run' }}
        run: |
          mkdir -p dist-apk
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found at $UNSIGNED_APK"
            exit 1
          fi
          cp "$UNSIGNED_APK" "dist-apk/Bapasitaram-ERP-release-unsigned.apk"
          sha256sum "dist-apk/Bapasitaram-ERP-release-unsigned.apk" > "dist-apk/Bapasitaram-ERP-release-unsigned.apk.sha256"
          ls -lh dist-apk/

      - name: Zipalign & Sign Release APK Using GitHub Encrypted Secrets
        if: ${{ inputs.signing_mode == 'signed_with_secrets' }}
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p dist-apk
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="dist-apk/Bapasitaram-ERP-release-signed.apk"
          KEYSTORE_FILE="$RUNNER_TEMP/release-keystore.jks"
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/36.0.0"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "Unsigned release APK not found at $UNSIGNED_APK"
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_FILE"
          chmod 600 "$KEYSTORE_FILE"

          "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$SIGNED_APK"
          sha256sum "$SIGNED_APK" > "dist-apk/Bapasitaram-ERP-release-signed.apk.sha256"
          ls -lh dist-apk/

      - name: Cleanup Temporary Signing & Secret Files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-keystore.jks" "$RUNNER_TEMP/app-release-aligned.apk"
          rm -f android/app/google-services.json

      - name: Upload Private Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bapasitaram-erp-release-${{ inputs.signing_mode }}-${{ github.run_number }}
          path: |
            dist-apk/*.apk
            dist-apk/*.sha256
          retention-days: 14
          if-no-files-found: error
